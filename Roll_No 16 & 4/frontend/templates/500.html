{% extends "base.html" %}

{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-danger mb-3">500</div>
    <h3 class="fw-bold mb-2">Internal Database Server Error</h3>
    <p class="text-muted mb-4">An unexpected condition occurred while querying the MySQL database server.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
        <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
