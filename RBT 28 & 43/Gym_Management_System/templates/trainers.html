{% extends "base.html" %}
{% block content %}
<h3>Trainers</h3>
<table class="table table-striped bg-white">
  <tr><th>ID</th><th>Name</th><th>Specialization</th><th>Phone</th><th>Members</th></tr>
  {% for t in trainers %}<tr><td>{{ t.trainer_id }}</td><td>{{ t.trainer_name }}</td><td>{{ t.specialization }}</td><td>{{ t.phone_no }}</td><td>{{ t.total }}</td></tr>{% endfor %}
</table>
<form method="post" class="card card-body shadow-sm" style="max-width:700px">
  <div class="row g-2">
    <div class="col"><input class="form-control" name="trainer_name" placeholder="Name" required></div>
    <div class="col"><input class="form-control" name="specialization" placeholder="Specialization"></div>
    <div class="col"><input class="form-control" name="phone_no" placeholder="Phone"></div>
    <div class="col-auto"><button class="btn btn-primary">Add Trainer</button></div>
  </div>
</form>
{% endblock %}
