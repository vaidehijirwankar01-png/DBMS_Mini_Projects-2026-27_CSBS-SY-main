{% extends "base.html" %}

{% block title %}Citizen Registration - WasteTracker{% endblock %}

{% block public_content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-6">
        <div class="card border-0 shadow-lg rounded-4 p-4 p-sm-5 bg-white">
            <div class="text-center mb-4">
                <div class="display-5 text-success mb-2">
                    <i class="bi bi-person-plus"></i>
                </div>
                <h3 class="fw-bold">Citizen Registration</h3>
                <p class="text-muted small">Join your community waste management and segregation initiative</p>
            </div>

            <form method="POST" action="{{ url_for('auth.register') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                <div class="mb-3">
                    <label for="full_name" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="full_name" name="full_name" required placeholder="e.g. Rahul Sharma">
                </div>

                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="user@example.com">
                    </div>
                    <div class="col-md-6">
                        <label for="phone" class="form-label fw-semibold">Phone Number</label>
                        <input type="text" class="form-control" id="phone" name="phone" placeholder="e.g. 9876543210">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="area_id" class="form-label fw-semibold">Residential Area / Zone</label>
                    <select class="form-select" id="area_id" name="area_id">
                        <option value="">Select your area (optional)</option>
                        {% for area in areas %}
                            <option value="{{ area.area_id }}">{{ area.area_name }} ({{ area.locality or 'General' }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="row g-2 mb-4">
                    <div class="col-md-6">
                        <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" name="password" required minlength="6" placeholder="Min 6 characters">
                    </div>
                    <div class="col-md-6">
                        <label for="confirm_password" class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6" placeholder="Re-enter password">
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow-sm mb-3">
                    Create Citizen Account
                </button>
            </form>

            <div class="text-center border-top pt-3 text-muted small">
                Already registered? <a href="{{ url_for('auth.login') }}" class="text-success fw-bold text-decoration-none">Sign In here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
