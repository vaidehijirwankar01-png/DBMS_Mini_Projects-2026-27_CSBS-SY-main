{% extends 'base.html' %}{% block content %}<div class="form-card"><h2>Create Account</h2><form method="post"><input name="name" placeholder="Full name" required><input type="email" name="email" placeholder="College email" required><input name="phone" placeholder="Phone"><input name="department" placeholder="Department (e.g. CSBS)" required><div class="row"><input type="number" name="year" min="1" max="4" placeholder="Year" required><input name="division" placeholder="Division" required></div><input type="password" name="password" placeholder="Password" required><button class="btn">Register</button></form></div>{% endblock %}
